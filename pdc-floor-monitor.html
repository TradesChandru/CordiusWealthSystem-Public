<title>PRISM · PDC Floor — Live</title>
<style>
  :root{
    --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --bg:#0A0E1A; --head:#10162A; --card:#141A2E; --card2:#0f1526;
    --line:rgba(255,255,255,0.06); --line2:rgba(255,255,255,0.10);
    --fg:#fff; --mut:#8892A4; --dim:#6b7488; --sec:#B4BCCC;
    --C:#00D4FF; --G:#00C896; --R:#FF3B5C; --A:#F5A623;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg)}
  body{font-family:var(--font-ui);-webkit-font-smoothing:antialiased;color:var(--fg);overflow-x:hidden}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes pPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  @keyframes pSpin{to{transform:rotate(360deg)}}
  @keyframes pFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes glowG{0%,100%{box-shadow:0 0 0 1px rgba(0,200,150,.35),0 0 26px -8px rgba(0,200,150,.5)}50%{box-shadow:0 0 0 1px rgba(0,200,150,.6),0 0 46px -6px rgba(0,200,150,.8)}}
  @keyframes glowR{0%,100%{box-shadow:0 0 0 1px rgba(255,59,92,.35),0 0 26px -8px rgba(255,59,92,.5)}50%{box-shadow:0 0 0 1px rgba(255,59,92,.6),0 0 46px -6px rgba(255,59,92,.8)}}

  .app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  /* header */
  header{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--head);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .brand{font-weight:800;letter-spacing:3px;font-size:15px}
  .brand .sub{color:var(--C);font-weight:700;letter-spacing:2px;margin-left:6px;font-size:12px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px}
  .dot{width:6px;height:6px;border-radius:50%;animation:pPulse 1.6s ease-in-out infinite}
  .px{font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--mut)}
  .spacer{flex:1}
  .hchip{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--C)}
  .tickspin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mut);border-top-color:transparent;animation:pSpin 1.1s linear infinite}

  /* anchor grid */
  .grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px;padding:14px 14px 4px}
  .anchor{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:11px;animation:pFade .3s ease;position:relative;transition:border-color .3s}
  .anchor.pending{opacity:.5;border-style:dashed}
  .anchor.pending.next{opacity:.85}
  .anchor.win{animation:glowG 2.6s ease-in-out infinite}
  .anchor.stop{animation:glowR 2.6s ease-in-out infinite}
  .anchor.next{border-color:var(--C);box-shadow:0 0 0 1px rgba(0,212,255,.5),0 0 34px -12px rgba(0,212,255,.85)}
  .c-next{background:rgba(0,212,255,.16);color:var(--C);border:1px solid rgba(0,212,255,.4)}
  .a-top{display:flex;align-items:flex-start;justify-content:space-between}
  .a-hour{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:-.5px}
  .a-hour small{font-size:11px;color:var(--mut);font-weight:500;letter-spacing:0}
  .a-acct{font-size:10px;color:var(--dim);margin-top:2px}
  .chip{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.5px}
  .c-live{background:rgba(0,200,150,.12);color:var(--G)}
  .c-pend{background:rgba(255,255,255,.06);color:var(--mut)}
  .c-long{background:rgba(0,200,150,.12);color:var(--G)}
  .c-short{background:rgba(255,59,92,.12);color:var(--R)}
  .c-neutral{background:rgba(255,255,255,.06);color:var(--mut)}
  .status{align-self:flex-start;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:1px}
  .s-win{background:rgba(0,200,150,.14);color:var(--G);border:1px solid rgba(0,200,150,.3)}
  .s-stop{background:rgba(255,59,92,.14);color:var(--R);border:1px solid rgba(255,59,92,.3)}
  .s-open{background:rgba(0,212,255,.12);color:var(--C);border:1px solid rgba(0,212,255,.3)}
  .s-carry{background:rgba(245,166,35,.14);color:var(--A);border:1px solid rgba(245,166,35,.3)}
  .s-skip,.s-flat{background:rgba(255,255,255,.06);color:var(--mut);border:1px solid var(--line2)}
  .pnl{font-family:var(--font-mono);font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1}
  .pos{color:var(--G)} .neg{color:var(--R)} .zero{color:var(--mut)}
  .a-kv{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);padding:2px 0}
  .a-kv b{color:var(--sec);font-weight:600;font-family:var(--font-mono)}
  .sig{display:flex;gap:14px;padding-top:9px;border-top:1px solid var(--line);font-size:11px}
  .sig .s{display:flex;align-items:center;gap:5px}
  .sig .n{font-family:var(--font-mono);font-weight:700;font-size:13px}

  /* 5-day P&L strip (anchor widget history) */
  .hist{padding-top:9px;border-top:1px solid var(--line)}
  .hist-h{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;color:var(--dim);letter-spacing:.5px;margin-bottom:6px}
  .hist-h b{font-family:var(--font-mono);font-size:12px;font-weight:700}
  .hbars{display:flex;gap:4px;align-items:flex-end;height:34px}
  .hbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
  .hb{width:100%;border-radius:3px 3px 2px 2px;min-height:3px;transition:height .3s}
  .hb.pos{background:var(--G)} .hb.neg{background:var(--R)} .hb.z{background:rgba(255,255,255,.09)}
  .hbar small{font-size:8px;color:var(--dim);font-family:var(--font-mono)}

  /* live vs BT block */
  .vsbt{padding-top:9px;border-top:1px solid var(--line)}
  .vsbt-t{font-size:10px;color:var(--dim);letter-spacing:.5px;margin-bottom:7px;display:flex;justify-content:space-between}
  .vsbt-t span{color:var(--C);opacity:.8}
  .vsbt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .vc{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
  .vc>span{font-size:9px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
  .vc b{font-family:var(--font-mono);font-size:14px;font-weight:700;line-height:1}
  .vc i{font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--mut)}
  .vstats{display:flex;gap:6px;flex-wrap:wrap}
  .vpill{flex:1;text-align:center;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.16);border-radius:7px;padding:4px 2px;font-size:9px;color:var(--mut);letter-spacing:.3px}
  .vpill b{display:block;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--sec);margin-top:1px}
  .vsbt-none{font-size:10px;color:var(--dim);padding-top:9px;border-top:1px solid var(--line)}
  /* same-day live-vs-BT per-session rows */
  .btrows{display:flex;flex-direction:column;gap:1px}
  .btrow{display:grid;grid-template-columns:38px 1fr 1.25fr;gap:6px;align-items:center;padding:3px 4px;border-radius:5px;font-size:11px}
  .btrow:hover{background:rgba(255,255,255,.03)}
  .btrow.bthdr{font-size:9px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase;padding-bottom:1px}
  .btrow .bd{font-family:var(--font-mono);color:var(--mut)}
  .btrow .bl{font-family:var(--font-mono);font-weight:600;text-align:right}
  .btrow .bb{font-family:var(--font-mono);font-weight:700;font-size:10px;text-align:right}
  .bt5d{font-size:10px;color:var(--mut);padding-top:7px;margin-top:3px;border-top:1px solid var(--line);text-align:center;font-family:var(--font-mono)}
  .bt5d b{font-weight:700}

  /* trades grouped by anchor */
  .tgroup{margin-bottom:12px}
  .tg-head{position:sticky;top:-6px;z-index:1;display:flex;align-items:baseline;gap:9px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line2)}
  .tg-head .th{font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--C)}
  .tg-head .ta{font-size:10px;color:var(--dim)}
  .tg-head .ts{margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:700}
  .tg-head .tn{font-size:10px;color:var(--mut)}

  /* bottom panel */
  .panel{flex:0 0 250px;height:250px;margin:10px 14px 14px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tabs{flex:0 0 auto;display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
  .tab{padding:8px 16px;border:none;background:none;cursor:pointer;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent}
  .tab.on{color:var(--fg);border-bottom-color:var(--C)}
  .pane{flex:1;min-height:0;overflow-y:auto;padding:6px 8px}
  .pane.hide{display:none}
  /* signal rows */
  .row{display:grid;grid-template-columns:52px 46px 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:12px}
  .row:hover{background:rgba(255,255,255,.03)}
  .row .t{font-family:var(--font-mono);color:var(--dim);font-size:11px}
  .row .anc{font-family:var(--font-mono);font-weight:700;font-size:11px;color:var(--C)}
  .row .desc{color:var(--sec)}
  .row .lvl{font-family:var(--font-mono);color:var(--mut);font-size:11px}
  .tag{padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700}
  .t-pass{background:rgba(0,200,150,.14);color:var(--G)}
  .t-fail{background:rgba(255,59,92,.13);color:var(--R)}
  .t-skip{background:rgba(255,255,255,.06);color:var(--mut)}
  .t-hedge{background:rgba(245,166,35,.14);color:var(--A)}
  /* signals view — summary bar + filters + rich rows */
  .sig-bar{position:sticky;top:-6px;z-index:2;background:var(--card);padding:2px 4px 9px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
  .sig-stats{display:flex;gap:6px;flex-wrap:wrap}
  .kchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;background:var(--card2);border:1px solid var(--line);font-size:11px;color:var(--mut)}
  .kchip b{font-family:var(--font-mono);font-weight:700;font-size:12px}
  .sig-filters{display:flex;gap:6px;flex-wrap:wrap}
  .fchip{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:11px;font-weight:600;font-family:var(--font-mono);cursor:pointer}
  .fchip:hover{color:var(--fg)}
  .fchip.on{border-color:var(--C);background:rgba(0,212,255,.1);color:var(--C)}
  .fchip .c{opacity:.65;margin-left:5px;font-weight:500}
  .srow{display:grid;grid-template-columns:60px 38px 118px 20px 1fr auto;gap:9px;align-items:center;padding:5px 8px;border-radius:7px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03);animation:pFade .2s ease}
  .srow:hover{background:rgba(255,255,255,.03)}
  .srow .t{font-family:var(--font-mono);color:var(--dim);font-size:11px}
  .srow .anc{font-family:var(--font-mono);font-weight:700;font-size:11px;color:var(--C)}
  .srow .k{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11px}
  .srow .k .ic{width:14px;text-align:center;font-size:12px}
  .srow .d{font-family:var(--font-mono);font-size:10px;font-weight:800}
  .srow .px{font-family:var(--font-mono);color:var(--mut);font-size:11px}
  .srow .px b{color:var(--sec);font-weight:600}
  .srow .r{text-align:right;font-family:var(--font-mono);font-size:11px}
  .k-entry{color:var(--G)} .k-reject{color:var(--R)} .k-hedge{color:var(--A)}
  .k-unwind{color:var(--A)} .k-exit{color:var(--C)} .k-orphan{color:var(--R)} .k-mut{color:var(--mut)}
  /* trades table */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:right;padding:5px 9px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;text-transform:uppercase;font-size:9px;letter-spacing:.5px;position:sticky;top:-6px;background:var(--card)}
  th:first-child,td:first-child{text-align:left}
  td.m{font-family:var(--font-mono)}
  .guide{padding:16px 20px;font-size:13px;line-height:1.6;color:var(--sec)}
  .guide h4{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--C);margin-bottom:8px}
  .guide p{margin-bottom:8px} .guide b{color:var(--fg)}
  footer{padding:8px 18px;color:var(--dim);font-size:11px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap}
  footer .mono{color:var(--mut)}
  .banner{margin:0 14px;padding:6px 12px;border-radius:8px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);color:var(--A);font-size:11px;font-weight:600;display:none}
  .banner.show{display:block}
</style>

<div class="app">
  <header>
    <span class="brand">PRISM<span class="sub">· PDC FLOOR</span></span>
    <span id="statusPill" class="pill"><span id="dot" class="dot"></span><span id="statusText">CONNECTING</span></span>
    <span class="px">XAUUSD</span>
    <span id="price" class="mono" style="font-size:19px;font-weight:600">—</span>
    <span id="change" class="mono" style="font-size:12px;color:var(--mut)">—</span>
    <span class="spacer"></span>
    <span id="live" class="hchip">— live</span>
    <span id="session" class="hchip" style="background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--mut)">—</span>
    <span id="utc" class="mono" style="font-size:12px;color:var(--mut)">—</span>
    <span class="tickspin"></span>
  </header>

  <div id="banner" class="banner"></div>
  <div id="grid" class="grid"></div>

  <div class="panel">
    <div class="tabs">
      <button class="tab on" data-tab="signals">Signals</button>
      <button class="tab" data-tab="trades">Trades</button>
    </div>
    <div id="pane-signals" class="pane"></div>
    <div id="pane-trades" class="pane hide"></div>
  </div>

  <footer>
    <span>src <span id="src" class="mono">api.cordius.in/pdc/floor</span></span>
    <span>anchors <span id="cnt" class="mono">—</span></span>
    <span>updated <span id="ts" class="mono">—</span></span>
    <span>auto-refresh 5s</span>
    <span id="err" style="color:var(--R)"></span>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var BASE=(new URLSearchParams(location.search).get('api')||'https://api.cordius.in').replace(/\/$/,'');
  var C='#00D4FF',G='#00C896',R='#FF3B5C',A='#F5A623',MUT='#8892A4';
  var $=function(id){return document.getElementById(id);};
  var tab='signals', now=Date.now(), last=null;
  var ORDER=[22,20,18,16,14,12,6];
  function money(v){return v==null?'—':(v>=0?'+$':'−$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function num(v,d){return v==null||isNaN(v)?'—':Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
  function ago(iso){var ms=now-new Date(iso).getTime();if(isNaN(ms))return '';var m=Math.floor(ms/60000);if(m<1)return 'now';if(m<60)return m+'m';var h=Math.floor(m/60);return h<24?h+'h':Math.floor(h/24)+'d';}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}

  function setStatus(mode){
    var el=$('statusPill'),dot=$('dot'),tx=$('statusText');
    if(mode==='online'){el.style.background='rgba(0,200,150,.1)';el.style.color=G;dot.style.background=G;tx.textContent='LIVE';}
    else{el.style.background='rgba(255,59,92,.1)';el.style.color=R;dot.style.background=R;tx.textContent='OFFLINE';}
  }

  function pnlCls(v){return v>0?'pos':v<0?'neg':'zero';}
  function statusCls(s){return ({WIN:'s-win',HARD_STOP:'s-stop',OPEN:'s-open',CARRY:'s-carry',SKIP:'s-skip',FLAT:'s-flat'})[s]||'s-flat';}

  var BTOUT={WIN:{c:'var(--G)',s:'WIN'},HARD_STOP:{c:'var(--R)',s:'STOP'},
             CARRY:{c:'var(--A)',s:'CARRY'},SKIP:{c:'var(--mut)',s:'SKIP'},FLAT:{c:'var(--mut)',s:'FLAT'}};
  function btLabel(x){var o=BTOUT[x.bt_outcome]; return o?(o.s+(x.bt_pnl?' '+money(x.bt_pnl):'')):'—';}

  // 5-day P&L strip from d.history[hour]: 5 magnitude bars, colour = sign; tooltip adds same-day BT
  function histStrip(hist, pnl5){
    if(!hist||!hist.length) return '';
    var mx=Math.max.apply(null,hist.map(function(x){return Math.abs(x.pnl)||0;}))||1;
    var bars=hist.map(function(x){
      var cls=x.pnl>0?'pos':x.pnl<0?'neg':'z';
      var hpx=Math.max(3,Math.round(30*Math.abs(x.pnl)/mx));
      var dow=['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(x.date+'T00:00:00Z').getUTCDay()];
      var bt=(x.bt_outcome!=null)?'  |  BT '+btLabel(x):'';
      return '<div class="hbar" title="'+x.date+': live '+money(x.pnl)+' ('+x.wins+'W/'+x.losses+'L)'+bt+'">'
        +'<div class="hb '+cls+'" style="height:'+hpx+'px"></div><small>'+dow+'</small></div>';
    }).join('');
    return '<div class="hist"><div class="hist-h"><span>5-DAY P&amp;L</span><b class="'+pnlCls(pnl5)+'">'+money(pnl5)+'</b></div>'
      +'<div class="hbars">'+bars+'</div></div>';
  }

  // LIVE vs SAME-DAY BT: the validated engine run seeded flat at go-live, per session.
  // Compares like-for-like — same PDC grid, same day — not a 6-year average.
  function isActive(x){
    return (x.pnl&&x.pnl!==0) || (x.bt_pnl&&x.bt_pnl!==0)
      || (x.bt_outcome&&x.bt_outcome!=='SKIP'&&x.bt_outcome!=='FLAT');
  }
  function vsBTDay(a, days){
    days=days||[];
    if(!days.some(function(x){return x.bt_outcome!=null;})) return '';   // BT not computed yet
    var today=days[days.length-1]||{};
    var to=BTOUT[today.bt_outcome]||{c:'var(--mut)',s:today.bt_outcome||'—'};
    var md=today.date?today.date.slice(5):'today';
    var btTxt=to.s+(today.bt_pnl?' '+money(today.bt_pnl):'');
    // prior active days (exclude today; most-recent first)
    var prior=days.slice(0,-1).filter(isActive).reverse().map(function(x){
      var o=BTOUT[x.bt_outcome]||{c:'var(--mut)',s:x.bt_outcome||'—'};
      return '<div class="btrow"><span class="bd">'+x.date.slice(5)+'</span>'
        +'<span class="bl '+pnlCls(x.pnl)+'">'+money(x.pnl)+'</span>'
        +'<span class="bb" style="color:'+o.c+'">'+o.s+(x.bt_pnl?' '+money(x.bt_pnl):'')+'</span></div>';
    }).join('');
    var priorBlock=prior?'<div class="btrows"><div class="btrow bthdr"><span>prior</span><span>live</span><span>bt (same session)</span></div>'+prior+'</div>':'';
    return '<div class="vsbt"><div class="vsbt-t"><span style="color:var(--dim)">LIVE vs BT</span><span>same-day · '+md+'</span></div>'
      +'<div class="vsbt-grid">'
      +'<div class="vc"><span>'+md+' · live</span><b class="'+pnlCls(today.pnl)+'">'+money(today.pnl)+'</b></div>'
      +'<div class="vc"><span>'+md+' · bt</span><b style="color:'+to.c+';font-size:13px">'+btTxt+'</b></div>'
      +'</div>'+priorBlock
      +'<div class="bt5d">5-day · live <b class="'+pnlCls(a.pnl5)+'">'+money(a.pnl5)+'</b> · bt <b class="'+pnlCls(a.bt_pnl5)+'">'+money(a.bt_pnl5!=null?a.bt_pnl5:0)+'</b></div>'
      +'</div>';
  }

  // the anchor whose reference time is CURRENTLY in effect (the most recent to tick,
  // valid until the next one), + when it hands over
  function activeAnchor(){
    var A=ORDER.slice().sort(function(x,y){return x-y;});   // ascending
    var nd=new Date(), nowH=nd.getUTCHours();
    var active; for(var i=A.length-1;i>=0;i--){ if(A[i]<=nowH){ active=A[i]; break; } }
    if(active===undefined) active=A[A.length-1];            // before the first anchor -> prev day's last (22)
    var next=A.find(function(x){return x>nowH;}), wrapNext=false;
    if(next===undefined){ next=A[0]; wrapNext=true; }
    var na=new Date(Date.UTC(nd.getUTCFullYear(),nd.getUTCMonth(),nd.getUTCDate()+(wrapNext?1:0),next,0,0));
    var m=Math.max(0,Math.round((na-nd)/60000));
    return {hour:active, next:next, cd:(m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m')};
  }
  function renderGrid(d){
    var byHour={}; d.anchors.forEach(function(a){byHour[a.hour]=a;});
    var hist=d.history||{};
    var nx=activeAnchor();
    $('grid').innerHTML=ORDER.map(function(h){
      var a=byHour[h]; if(!a) return '';
      var isNext=(h===nx.hour);
      var nextChip=isNext?'<span class="chip c-next" title="active reference; hands over to '+String(nx.next).padStart(2,'0')+':00 in '+nx.cd+'">ACTIVE · →'+String(nx.next).padStart(2,'0')+'h '+nx.cd+'</span>':'';
      if(a.state==='pending'){
        return '<div class="anchor pending'+(isNext?' next':'')+'"><div class="a-top"><div><div class="a-hour">'+String(h).padStart(2,'0')+':00 <small>UTC</small></div><div class="a-acct">no audit rows yet</div></div>'+(nextChip||'<span class="chip c-pend">IDLE</span>')+'</div><div class="status s-flat">AWAITING FIRST TRADE</div><div class="pnl zero">—</div>'
          +vsBTDay(a,hist[String(h)])+'</div>';
      }
      var glow=a.status==='WIN'?' win':a.status==='HARD_STOP'?' stop':'';
      var modeCls=a.mode==='LONG'?'c-long':a.mode==='SHORT'?'c-short':'c-neutral';
      return '<div class="anchor'+glow+(isNext?' next':'')+'">'
        +'<div class="a-top"><div><div class="a-hour">'+String(h).padStart(2,'0')+':00 <small>UTC</small></div>'
        +'<div class="a-acct">acct '+a.account+(a.login?' · login '+a.login:'')+'</div></div>'
        +'<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">'
        +nextChip+'<span class="chip c-live">LIVE</span><span class="chip '+modeCls+'">'+(a.mode||'—')+'</span></div></div>'
        +'<span class="status '+statusCls(a.status)+'">'+(a.status||'—')+'</span>'
        +'<div class="pnl '+pnlCls(a.pnl)+'">'+money(a.pnl)+'</div>'
        +'<div><div class="a-kv"><span>PDC</span><b>'+num(a.pdc,2)+'</b></div>'
        +'<div class="a-kv"><span>Step</span><b>'+num(a.step,2)+'</b></div>'
        +'<div class="a-kv"><span>Open positions</span><b>'+a.n_open+'</b></div></div>'
        +'<div class="sig"><span class="s"><span style="color:var(--G)">✓ passed</span> <span class="n" style="color:var(--G)">'+a.sig_pass+'</span></span>'
        +'<span class="s"><span style="color:var(--R)">✗ failed</span> <span class="n" style="color:var(--R)">'+a.sig_fail+'</span></span></div>'
        +histStrip(hist[String(h)],a.pnl5)
        +vsBTDay(a,hist[String(h)])
        +'</div>';
    }).join('');
  }

  var KMETA={
    ENTRY:{ic:'▲',lbl:'ENTRY',cls:'k-entry'},
    ENTRY_REJECT:{ic:'✕',lbl:'REJECT',cls:'k-reject'},
    HEDGE_PLACED:{ic:'⊕',lbl:'HEDGE ARM',cls:'k-hedge'},
    HEDGE_FILLED:{ic:'⊕',lbl:'HEDGE FILL',cls:'k-hedge'},
    UNWIND:{ic:'⊖',lbl:'UNWIND',cls:'k-unwind'},
    UNWIND_CANCEL:{ic:'⊘',lbl:'UNWIND CXL',cls:'k-mut'},
    EXIT:{ic:'●',lbl:'EXIT',cls:'k-exit'},
    EXIT_PENDING:{ic:'○',lbl:'EXIT PEND',cls:'k-mut'},
    ORPHAN_CLOSED:{ic:'⚠',lbl:'ORPHAN',cls:'k-orphan'}
  };
  var STAT_ORDER=['ENTRY','ENTRY_REJECT','HEDGE_FILLED','UNWIND','EXIT','ORPHAN_CLOSED'];
  var sigFilter='all';
  function clock(ts){return (ts||'').slice(11,19);}

  function renderSignals(d){
    var sigs=d.signals||[], kinds=d.kinds||{};
    var anchors=(d.anchors||[]).filter(function(a){return a.state==='live';});
    // ── summary: per-kind daily totals ──
    var stats=STAT_ORDER.filter(function(k){return kinds[k];}).map(function(k){
      var m=KMETA[k]; return '<span class="kchip"><span class="'+m.cls+'">'+m.ic+'</span>'+m.lbl+' <b class="'+m.cls+'">'+kinds[k]+'</b></span>';
    }).join('');
    if(!stats) stats='<span class="kchip" style="color:var(--dim)">no signals today yet</span>';
    // ── filter chips: ALL + per live anchor (with ✓/✗ counts) ──
    var tp=anchors.reduce(function(s,a){return s+(a.sig_pass||0);},0);
    var tf=anchors.reduce(function(s,a){return s+(a.sig_fail||0);},0);
    var chips='<button class="fchip'+(sigFilter==='all'?' on':'')+'" data-f="all">ALL<span class="c">✓'+tp+' ✗'+tf+'</span></button>'
      +anchors.map(function(a){return '<button class="fchip'+(String(sigFilter)==String(a.hour)?' on':'')+'" data-f="'+a.hour+'">'+a.tag+'<span class="c">✓'+a.sig_pass+' ✗'+a.sig_fail+'</span></button>';}).join('');
    // ── feed rows (filtered) ──
    var feed=sigs.filter(function(x){return sigFilter==='all'||String(x.hour)===String(sigFilter);});
    var rows=feed.map(function(x){
      var m=KMETA[x.kind]||{ic:'·',lbl:x.kind,cls:'k-mut'};
      var dir=x.dir?'<span class="d" style="color:'+(x.dir==='LONG'?'var(--G)':'var(--R)')+'">'+(x.dir==='LONG'?'L':'S')+'</span>':'<span></span>';
      var px=(x.level!=null?num(x.level,2):'—');
      if(x.fill!=null && x.fill!==x.level) px+=' <b>→ '+num(x.fill,2)+'</b>';
      var right=(x.pnl!=null)?'<span class="'+pnlCls(x.pnl)+'">'+money(x.pnl)+'</span>'
        :(x.pos?'<span style="color:var(--dim)">#'+esc(String(x.pos)).slice(-6)+'</span>':'');
      return '<div class="srow"><span class="t">'+clock(x.ts)+'</span>'
        +'<span class="anc">'+String(x.hour).padStart(2,'0')+'h</span>'
        +'<span class="k '+m.cls+'"><span class="ic">'+m.ic+'</span>'+m.lbl+'</span>'
        +dir+'<span class="px">'+px+'</span><span class="r">'+right+'</span></div>';
    }).join('');
    if(!rows) rows='<div class="srow" style="color:var(--dim);grid-template-columns:1fr">no events for this anchor</div>';
    $('pane-signals').innerHTML='<div class="sig-bar"><div class="sig-stats">'+stats+'</div><div class="sig-filters">'+chips+'</div></div>'+rows;
    Array.prototype.forEach.call($('pane-signals').querySelectorAll('.fchip'),function(b){
      b.addEventListener('click',function(){var f=b.getAttribute('data-f');sigFilter=(f==='all')?'all':+f;renderSignals(last||d);});
    });
  }
  function renderTrades(d){
    var tr=(d.trades||[]);
    if(!tr.length){$('pane-trades').innerHTML='<div style="padding:12px;color:var(--dim);font-size:12px">no trades in the last 5 days</div>';return;}
    var groups={}; tr.forEach(function(x){(groups[x.hour]=groups[x.hour]||[]).push(x);});
    var byHour={}; (d.anchors||[]).forEach(function(a){byHour[a.hour]=a;});
    $('pane-trades').innerHTML=ORDER.filter(function(h){return groups[h];}).map(function(h){
      var rows=groups[h], a=byHour[h]||{};
      var sum=rows.reduce(function(s,x){return s+(x.pnl||0);},0);
      var head='<div class="tg-head"><span class="th">'+String(h).padStart(2,'0')+'h</span>'
        +'<span class="ta">'+(a.account?'acct '+a.account:'')+(a.mode?' · '+a.mode:'')+'</span>'
        +'<span class="ts '+pnlCls(sum)+'">'+money(sum)+' <span class="tn">'+rows.length+' trades</span></span></div>';
      var body='<table><tbody>'+rows.map(function(x){
        var st=x.status,stc=st==='CLOSED'?(x.pnl>=0?'t-pass':'t-fail'):st==='CARRY'?'t-hedge':st==='HEDGED'?'t-hedge':'t-skip';
        return '<tr><td class="m" style="color:var(--dim)">'+ago(x.ts)+'</td>'
          +'<td class="m">'+num(x.level,2)+'</td><td class="m" style="color:var(--mut)">'+esc(x.pos_id)+'</td>'
          +'<td class="m">'+num(x.lots,2)+'</td><td class="m '+pnlCls(x.pnl)+'">'+(x.pnl!=null?money(x.pnl):'—')+'</td>'
          +'<td><span class="tag '+stc+'">'+st+'</span></td></tr>';
      }).join('')+'</tbody></table>';
      return '<div class="tgroup">'+head+body+'</div>';
    }).join('');
  }

  function render(d,mode){
    now=Date.now(); setStatus(mode);
    $('price').textContent=num(d.price,2);
    var ch=d.change; $('change').textContent=(ch>=0?'+':'')+num(ch,2);
    $('change').style.color=ch>=0?G:R;
    $('session').textContent=d.session||'—';
    var liveN=d.anchors.filter(function(a){return a.state==='live';}).length;
    $('live').textContent=liveN+' / '+(d.total||d.anchors.length)+' live';
    $('utc').textContent=new Date().toISOString().replace('T',' ').slice(0,19)+'Z';
    $('cnt').textContent=liveN+'/'+(d.total||d.anchors.length);
    $('ts').textContent=(d.ts||'').replace('T',' ').slice(11,19);
    $('banner').className='banner';
    renderGrid(d); renderSignals(d); renderTrades(d);
  }

  function renderEmpty(){
    $('grid').innerHTML=ORDER.map(function(h){
      return '<div class="anchor pending"><div class="a-top"><div><div class="a-hour">'+String(h).padStart(2,'0')+':00 <small>UTC</small></div><div class="a-acct">awaiting /pdc/floor</div></div></div><div class="pnl zero">—</div></div>';
    }).join('');
    $('pane-signals').innerHTML='<div class="row" style="color:var(--dim)">awaiting live data…</div>';
    $('pane-trades').innerHTML='<div style="padding:12px;color:var(--dim);font-size:12px">awaiting live data…</div>';
    $('cnt').textContent='—'; $('live').textContent='— / 7 live'; $('ts').textContent='—'; $('price').textContent='—';
  }

  // tabs
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.addEventListener('click',function(){
      tab=b.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x===b);});
      ['signals','trades'].forEach(function(p){$('pane-'+p).classList.toggle('hide',p!==tab);});
    });
  });

  function tick(){
    var ctrl=new AbortController(); var to=setTimeout(function(){ctrl.abort();},4000);
    fetch(BASE+'/pdc/floor',{signal:ctrl.signal,cache:'no-store',headers:{'Accept':'application/json'}})
      .then(function(r){return r.json();})
      .then(function(d){clearTimeout(to);last=d;$('err').textContent='';render(d,'online');})
      .catch(function(){
        clearTimeout(to); setStatus('offline'); $('err').textContent='· /pdc/floor unreachable';
        $('banner').className='banner show'; $('banner').textContent='Live feed unreachable — /pdc/floor did not respond. Retrying every 5s.';
        if(!last) renderEmpty();          // no fabricated data — real feed or empty state only
      });
  }
  // Same-day BT now arrives inside /pdc/floor (history[].bt_pnl/bt_outcome), written
  // by the daily Fargate BT into pdc_bt_daily — no static sidecar / average.
  renderEmpty(); tick(); setInterval(tick,5000);
})();
</script>
